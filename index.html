t ancestral.\",\n l:\"Une histoire simple devient trompeuse lorsqu'elle remplace toute *L'EXPLICATION*.\",\n more:\"En 1947, l'agence N. W. Ayer crée pour De Beers le slogan « Un diamant est éternel ». La rareté du diamant était organisée par la marque, qui contrôlait l'offre. Une tradition qui semble ancestrale peut être une campagne.\"},\n{ic:'waf',\n t:\"LA SEMELLE AU GAUFRIER\",\n p:\"En 1971, Bill Bowerman versa de l'uréthane liquide dans le gaufrier familial pour créer la première semelle Nike. L'appareil fut scellé et enterré dans le jardin, avant d'être déterré **40 ans plus tard** pour intégrer les archives officielles de la marque.\",\n q:\"POURQUOI UNE MARQUE MONDIALE CONTINUE-T-ELLE DE RACONTER CE DÉTAIL DE CUISINE 50 ANS PLUS TARD ?\",\n photos:[{img:GAUF,alt:\"Une chaussure Nike à semelle gaufrée posée près d'un gaufrier, dans une vitrine\",cap:\"Une chaussure à semelle gaufrée et le gaufrier qui l'a inspirée.\"}],\n o:[\"Parce que leurs chaussures sont toujours fabriquées de manière artisanale dans une cuisine.\",\"Parce qu'un mythe d'ingéniosité fait oublier la réalité de la production industrielle.\"],\n c:1,\n hors:\"Ce que le récit laisse hors champ\",\n vd:\"Un mythe de marque fonctionne en sélectionnant un détail humain et en faisant oublier la réalité industrielle.\",\n l:\"Une histoire simple devient trompeuse lorsqu'elle remplace toute *L'EXPLICATION*.\",\n more:\"L'anecdote du gaufrier est devenue la légende de Nike. Aujourd'hui, les chaussures sont fabriquées en grande série par des sous-traitants, loin de toute cuisine. Le récit montre l'inventeur, jamais l'usine.\"},\n{ic:'zap',\n t:\"RED BULL : « RED BULL DONNE DES AILES »\",\n p:\"Plutôt que d'axer sa communication sur les ingrédients ou le goût de sa boisson énergisante, Red Bull finance des sports extrêmes, des compétitions de haut niveau et des exploits hors normes (comme le saut depuis la stratosphère de Felix Baumgartner). La marque ne vend pas une boisson, elle vend **un mode de vie intense et intrépide**.\",\n q:\"QUEL [[LEVIER DU RÉCIT MARKETING]] A PROVOQUÉ LE SUCCÈS MONDIAL DE RED BULL ?\",\n v:{src:\"RED BULL : LE RÉCIT DU DÉPASSEMENT DE SOI ET DE L'ADRÉNALINE · DÉCRYPTAGE\",obs:\"repère comment le récit de l'aventure et de la performance s'efface derrière le produit pour créer une communauté d'appartenance.\",title:\"Red Bull : le récit du dépassement de soi et de l'adrénaline\",sub:\"YouTube Short · Décryptage\",url:\"https://youtube.com/shorts/5gTtZx9nhwg?si=iOgH_nOzLfILk_9L\"},\n o:[\"La mise en scène d'un récit d'aventure et de dépassement de soi qui associe la marque au statut de héros audacieux.\",\"La mise en avant des ingrédients stimulants et de la composition technique de la canette.\"],\n c:0,\n vd:\"Red Bull ne vend pas une boisson, mais la promesse d'une vie intense et audacieuse. En finançant des exploits extrêmes, la marque transforme une simple canette en symbole de dépassement de soi.\",\n l:\"Vendre du spectacle ne dit rien de l'*EFFICACITÉ* réelle du produit.\",\n more:\"On n'achète pas Red Bull pour son goût, mais pour l'histoire qu'elle raconte : consommer la marque, c'est adopter l'image d'une personne dynamique et sans limites. Le produit devient la clé d'un style de vie.\"},\n{ic:'heart',\n t:\"INTERMARCHÉ : L'ART DU FILM ÉMOTIONNEL\",\n p:\"Plutôt que d'axer sa publicité sur les promotions, les prix bas ou la liste des rayons, Intermarché réalise de véritables courts-métrages de cinéma. La marque ne vend pas des produits : elle vend **l'amour, le bien-manger et l'attention portée aux autres**.\",\n q:\"QUEL LEVIER A PERMIS À [[INTERMARCHÉ]] DE SE DÉMARQUER DE TOUS LES AUTRES SUPERMARCHÉS ?\",\n v:{src:\"INTERMARCHÉ · CONTE DE NOËL · AGENCE ROMANCE · 2025\",obs:\"repère comment un film d'animation associe l'enseigne à l'amitié et au bien-manger.\",title:\"Intermarché - Conte de Noël\",sub:\"YouTube · Film de Noël 2025\",url:\"https://youtu.be/Na9VmMNJvsA?si=IBTC2ncP5aGgfXXZ\",wide:true},\n o:[\"La comparaison directe des prix du kilo de carottes par rapport aux enseignes concurrentes.\",\"La mise en scène d'un récit cinématographique touchant qui associe la marque à l'amour, à la santé et au réconfort.\"],\n c:1,\n vd:\"Un récit marketing efficace transforme une corvée banale (faire ses courses) en une expérience chargée d'émotion. Intermarché ne te vend pas de la nourriture industrielle, mais l'histoire d'une transformation personnelle par le bien-manger.\",\n l:\"Une histoire simple devient trompeuse lorsqu'elle remplace toute *L'EXPLICATION*.\",\n more:\"Intermarché a associé ses magasins à la romance et à l'empathie. L'émotion suscitée par le film fait oublier le côté commercial du supermarché pour transformer l'enseigne en un acteur complice et chaleureux du quotidien.\"}];\nlet n=0,mode='enq';\nfunction media(e){\n if(e.photos)return'<div class=\"med\"><div class=\"ph one\">'+e.photos.map(p=>'<figure><img src=\"'+p.img+'\" alt=\"'+p.alt+'\"><figcaption>'+p.cap+'<\/figcaption><\/figure>').join('')+'<\/div><\/div>';\n if(!e.v)return'';const v=e.v,m=toEmbed(v.url);\n return'<div class=\"med\"><div class=\"src mono\">'+sv('clap')+'<span>'+v.src+'<\/span><\/div><div class=\"obs\">'+sv('eye')+'<span><b>Observe :<\/b> '+v.obs+'<\/span><\/div><div class=\"vp'+(v.wide?' w':'')+'\" id=\"vp\"><button id=\"pl\" aria-label=\"Lire la vidéo\"><span class=\"pl\">'+sv('play')+'<\/span><strong>'+v.title+'<\/strong><small>'+v.sub+'<\/small><\/button><\/div><p class=\"lk\">Ne se charge pas ? <a href=\"'+v.url+'\" target=\"_blank\" rel=\"noopener\">▶ Regarder sur '+(m?m.name:'le site')+'<\/a><\/p><\/div>';\n}\nfunction render(){\n const e=E[n];mode='enq';$('enq').classList.remove('hide');$('trn').classList.add('hide');$('pf').style.width=(n*25)+'%';$('res').innerHTML='';\n const Q='<p class=\"q\">'+fm(e.q)+'<\/p>';\n $('card').innerHTML='<div class=\"hd\"><div class=\"ic\">'+sv(e.ic)+'<\/div><span class=\"en mono\">ENQUÊTE '+(n+1)+'<\/span><\/div><h2>'+e.t+'<\/h2><div class=\"box\"><p>'+ s=\"tag mono\">CAS ISOLÉ · V5<\/span><\/div>\n<div class=\"sheet\"><div class=\"hd\"><div class=\"mono\">— Pour aller plus loin —<\/div><h1>DEVIENS EXPERT<\/h1><p>Trois portes pour aller plus loin et ancrer ce que tu viens d'apprendre.<\/p><\/div>\n<div class=\"doors\">\n<article class=\"card p1\"><div class=\"cover\" aria-hidden=\"true\"><small class=\"mono\">ESSAI · LA DÉCOUVERTE<\/small><strong>Storytelling<\/strong><small class=\"mono\">CHRISTIAN SALMON<\/small><\/div>\n<div class=\"col\"><span class=\"pill mono\">MISSION AVANT DE LIRE<\/span><h2>REPÈRE COMMENT LA MACHINE À RACONTER DES HISTOIRES <mark>FORMATE NOTRE ESPRIT CRITIQUE.<\/mark><\/h2>\n<p>Christian Salmon analyse l'émergence du storytelling comme un outil de pouvoir et de conviction commercial. L'ouvrage montre comment les récits de marque ne cherchent plus seulement à persuader par des arguments, mais à façonner directement nos représentations et nos désirs. L’ouvrage est paru en 2007 et réédité en 2008.<\/p>\n<div class=\"ref\"><b>Christian Salmon<\/b> — <i>Storytelling : La machine à fabriquer des histoires et à formater les esprits<\/i> (Éditions La Découverte, 2007 / Poche 2008)<\/div>\n<a class=\"go mono\" href=\"https://www.editionsladecouverte.fr/storytelling-9782707156518\" target=\"_blank\" rel=\"noopener\">VOIR LE LIVRE CHEZ L'ÉDITEUR ➔<\/a><\/div><\/article>\n<article class=\"card\"><span class=\"pill n mono\">► TEDXMINESNANCY · PANSER LE STORYTELLING · DIDIER CHAMBARETAUD · 2021<\/span><span class=\"pill mono\">MISSION AVANT DE REGARDER<\/span>\n<h2>REPÈRE LES RÈGLES DE FABRICATION D'UNE HISTOIRE ET LE MOMENT OÙ LE RÉCIT DEVENU TROP SATURÉ PERD DE SA SINCÉRITÉ.<\/h2>\n<p>Didier Chambaretaud décortique la mécanique du récit (personnage, but, enjeu, épreuve) et interroge l'omniprésence du storytelling au quotidien. Il explique comment la sursaturation d'histoires pousse le public à exiger plus de sincérité face aux récits commerciaux.<\/p>\n<button class=\"vid\" id=\"vid\" aria-label=\"Lire la vidéo Panser le storytelling\"><span class=\"in\"><span class=\"pl\"><i><\/i><\/span><strong>Panser le storytelling — Didier Chambaretaud<\/strong><small>Regarder sur YouTube<\/small><\/span><\/button>\n<p class=\"lk\">Ne se charge pas ? <a href=\"https://youtu.be/T3pARvxhnLE?si=VKj9YYRGxINwkbEq\" target=\"_blank\" rel=\"noopener\">Ouvrir sur YouTube<\/a><\/p><\/article><\/div>\n<section class=\"p3\"><div class=\"ico\" aria-hidden=\"true\"><svg viewBox=\"0 0 24 24\" width=\"30\" height=\"30\" fill=\"none\" stroke=\"#0a1260\" stroke-width=\"2\" stroke-linecap=\"round\"><circle cx=\"12\" cy=\"12\" r=\"8\"/><circle cx=\"12\" cy=\"12\" r=\"4\"/><circle cx=\"12\" cy=\"12\" r=\"1\"/><\/svg><\/div><div><span class=\"pill mono\">DÉFI 24H<\/span>\n<p>Dans les prochaines 24 heures, repère <strong>UNE histoire de marque ou de réussite<\/strong> : une publicité, une vidéo, un article ou un post. Note ce que le récit met en lumière. Puis cherche au moins <strong>UN élément qu'il laisse hors champ<\/strong> : les conditions réelles de fabrication, le coût masqué ou les intermédiaires.<\/p>\n<b>Dernière question : la perception du produit change-t-elle quand tu dévoiles ce qui n'est pas raconté ?<\/b><\/div><\/section>\n<section class=\"card sv\"><div class=\"mono\">AVANT DE POURSUIVRE<\/div><h3>CET OUTIL T'A CONVAINCU ?<\/h3>\n<div class=\"ch\" role=\"radiogroup\" aria-label=\"Sondage\" id=\"ch\"><button role=\"radio\" aria-checked=\"false\"><i style=\"background:#22c55e\"><\/i>Convaincu<\/button><button role=\"radio\" aria-checked=\"false\"><i style=\"background:#fb923c\"><\/i>Mitigé<\/button><button role=\"radio\" aria-checked=\"false\"><i style=\"background:#ef4444\"><\/i>Pas convaincu<\/button><\/div>\n<div id=\"thx\" aria-live=\"polite\"><\/div><\/section>\n<button id=\"fin\" class=\"mono\" aria-disabled=\"true\">TERMINER LE MODULE ➔<\/button>\n<div id=\"done\"><b>MODULE TERMINÉ<\/b><span>Bravo, tu as passé les 8 étapes. À toi de jouer dans la vraie vie !<\/span><\/div>
